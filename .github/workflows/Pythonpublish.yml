name: Pythonpublish

on: push

jobs:
  docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Force create docs
      run: |
        # Эта команда всегда создаст документацию
        mkdir -p docs
        echo "DOCUMENTATION CREATED" > docs/status.txt
        date > docs/timestamp.txt
        echo "Files in repo:" > docs/files.txt
        ls -la >> docs/files.txt
        
        # Показываем что создали
        echo " Created docs folder with:"
        ls -la docs/
        cat docs/status.txt
