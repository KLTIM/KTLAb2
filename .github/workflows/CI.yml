name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Add docs to README
      run: |
        echo "" >> README.md
        echo "## Документация" >> README.md
        echo "Файлы проекта:" >> README.md
        for f in *.py; do
          echo "- $f" >> README.md
        done
        echo "Обновлено: $(date)" >> README.md
