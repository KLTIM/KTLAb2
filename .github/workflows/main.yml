name: Python CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install simple docstring tool
      run: pip install docstring-gen==0.2.3
        
    - name: Run CI/CD Tests
      run: |
        python pythonr.py
        
    - name: Auto-generate basic docs
      run: |
        python -c "

import os

for file in os.listdir('.'):
    if file.endswith('.py'):
        try:
            with open(file, 'r') as f:
                content = f.read()
            
