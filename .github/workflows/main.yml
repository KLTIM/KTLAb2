name: Python CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install docstring generator
      run: pip install docstring-generator
        
    - name: Run CI/CD Tests
      run: |
        python pythonr.py
        
    - name: Auto-generate docstrings
      run: |
        # Автогенерация docstring для измененных файлов
        changed_files=$(git diff --name-only HEAD^ HEAD -- '*.py' 2>/dev/null || find . -name "*.py")
        for file in $changed_files; do
          if [ -f "$file" ]; then
            python -m docstring_generator "$file" --in-place 2>/dev/null || true
          fi
        done
        
    - name: Commit generated docs
      if: always()
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Auto-generated documentation" || true
        git push || true
