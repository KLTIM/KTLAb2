name: Python CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Run CI/CD Tests
      run: |
        python pythonr.py
        
        # документация 
        mkdir -p docs
        for f in *.py; do
          python -m pydoc "${f%.py}" > "docs/$f.txt" 2>/dev/null || true
        done
        echo "Docs generated" > docs/status.txt
